# **ルートを継ぐ。** `unawaited_futures` / `discarded_futures` はここにも掛かる。
include: ../../analysis_options.yaml

analyzer:
  exclude:
    # **このリポジトリ初の生成物である**（`schema.g.dart` / `migrations.g.dart` は 2026-09-02 の
    # 凍結で生成器ごと消え、いまは普通のソースである）。ルートが全体に掛けている
    # `unawaited_futures` / `discarded_futures` は生成物を赤にするので、ここで外す。
    - "**/*.g.dart"
    # flutter tool が足す。**消しても次の `flutter test` で戻る。**
    - build/**

