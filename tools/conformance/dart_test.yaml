# 実 Drive を叩く試験は、無印の `dart test` では走らせない。
#
# **conformance の既定は「ネットワークも token も要らない」である。** D1〜D3 と自己検査、
# `.blib` の相互運用はどれもローカルで閉じる。実 Drive を挟む相互運用（P2c の受入③）だけを
# タグで分け、既定から外す。走らせるときは preset で明示する:
#
#     dart test -P drive
#
# `packages/karita_platform/dart_test.yaml` と同じ形にしてある。**`-t drive` では選べない** —
# 設定の `exclude_tags` は `-t` より強い。preset の側で除外を外すことで、「明示したときだけ
# 走る」を1つの入口に固定する。
#
# **`--run-skipped` は使わない。** それを使うと、token・正本 repo・uv のどれかが無いときに
# 試験が自分で飛ぶための `skip` まで無効になり、揃っていない環境で赤くなる。
# **飛んだ理由が見える方を残す。**
tags:
  drive:

exclude_tags: drive

presets:
  drive:
    include_tags: drive
    # 既定の除外を打ち消す。存在しないタグを指す。
    exclude_tags: never-matches-any-test
