org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# **android.enableJetifier は持たない**（P5a で外した。2026-09-14）。AndroidX 移行期の道具で、
# Flutter 3.47.4 の template にも無い。
#
# **AGP 9 の新しい既定を2つ切る。** どちらも Flutter 3.47.4 の template が自分で書いているもので
# （"This flag was added by the Flutter template"）、Flutter の Gradle plugin は旧 DSL と
# 外部の Kotlin plugin を前提にしている。**消すと噛み合わない。**
android.newDsl=false
android.builtInKotlin=false
